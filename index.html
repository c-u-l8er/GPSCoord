<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPSCoord - Fleet Management Dashboard</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Auth Screen */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .auth-logo p {
            color: var(--gray);
            font-size: 0.95rem;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--gray);
            font-size: 0.875rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-divider span {
            padding: 0 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--border);
            color: var(--dark);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* Dashboard Layout */
        .dashboard {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .nav-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .nav-tab:hover {
            background: var(--light);
            color: var(--dark);
        }

        .nav-tab.active {
            background: var(--primary);
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-menu {
            position: relative;
        }

        .user-button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-button:hover {
            border-color: var(--primary);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            overflow: hidden;
        }

        .dropdown-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            width: 100%;
            text-align: left;
            background: white;
            color: var(--dark);
            font-size: 0.95rem;
        }

        .dropdown-item:hover {
            background: var(--light);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--gray);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .stat-card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.875rem;
        }

        .stat-change {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .stat-change.positive {
            background: #dcfce7;
            color: #16a34a;
        }

        .stat-change.negative {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Card */
        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-input:disabled {
            background: var(--light);
            cursor: not-allowed;
        }

        /* API Keys Table */
        .api-keys-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .api-key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--light);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .api-key-info {
            flex: 1;
        }

        .api-key-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .api-key-value {
            font-family: monospace;
            color: var(--gray);
            font-size: 0.875rem;
        }

        .api-key-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border-radius: 8px;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #dcfce7;
            color: #16a34a;
        }

        .badge-warning {
            background: #fef3c7;
            color: #d97706;
        }

        .badge-info {
            background: #dbeafe;
            color: #2563eb;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--gray);
            margin-bottom: 1.5rem;
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .header-left {
                flex-direction: column;
                gap: 1rem;
            }

            .main {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .api-key-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div x-data="app()" x-cloak>
        <!-- Auth Screen -->
        <template x-if="!isAuthenticated">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-logo">
                        <h1>GPSCoord</h1>
                        <p>Manage your fleet tracking infrastructure</p>
                    </div>

                    <button @click="loginWithWorkOS('Google')" class="btn btn-outline" style="margin-bottom: 0.75rem;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Continue with Google
                    </button>

                    <button @click="loginWithWorkOS('Microsoft')" class="btn btn-outline" style="margin-bottom: 0.75rem;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zm12.6 0H12.6V0H24v11.4z" fill="#00A4EF"/>
                        </svg>
                        Continue with Microsoft
                    </button>

                    <button @click="loginWithWorkOS('GitHub')" class="btn btn-outline">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        Continue with GitHub
                    </button>

                    <div class="auth-divider">
                        <span>or use demo mode</span>
                    </div>

                    <button @click="demoLogin()" class="btn btn-primary">
                        Continue as Demo User
                    </button>

                    <p style="text-align: center; color: var(--gray); font-size: 0.875rem; margin-top: 1.5rem;">
                        By continuing, you agree to our Terms and Privacy Policy
                    </p>
                </div>
            </div>
        </template>

        <!-- Dashboard -->
        <template x-if="isAuthenticated">
            <div class="dashboard">
                <!-- Header -->
                <header class="header">
                    <div class="header-left">
                        <div class="logo">GPSCoord</div>
                        <nav class="nav-tabs">
                            <button 
                                @click="currentTab = 'overview'" 
                                :class="{'active': currentTab === 'overview'}"
                                class="nav-tab">
                                Overview
                            </button>
                            <button 
                                @click="currentTab = 'api-keys'" 
                                :class="{'active': currentTab === 'api-keys'}"
                                class="nav-tab">
                                API Keys
                            </button>
                            <button 
                                @click="currentTab = 'usage'" 
                                :class="{'active': currentTab === 'usage'}"
                                class="nav-tab">
                                Usage
                            </button>
                            <button 
                                @click="currentTab = 'settings'" 
                                :class="{'active': currentTab === 'settings'}"
                                class="nav-tab">
                                Settings
                            </button>
                        </nav>
                    </div>

                    <div class="header-right">
                        <span class="badge badge-success">
                            <span style="width: 6px; height: 6px; background: currentColor; border-radius: 50%; display: inline-block; margin-right: 0.5rem;"></span>
                            api.webhost.systems
                        </span>

                        <div class="user-menu" x-data="{open: false}">
                            <button @click="open = !open" class="user-button">
                                <div class="user-avatar" x-text="user.name.charAt(0)"></div>
                                <span x-text="user.name"></span>
                                <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                </svg>
                            </button>

                            <div x-show="open" @click.away="open = false" class="dropdown">
                                <button @click="currentTab = 'settings'; open = false" class="dropdown-item">Account Settings</button>
                                <button @click="open = false" class="dropdown-item">Documentation</button>
                                <div class="dropdown-divider"></div>
                                <button @click="logout()" class="dropdown-item" style="color: var(--danger);">Sign Out</button>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Main Content -->
                <main class="main">
                    <!-- Overview Tab -->
                    <template x-if="currentTab === 'overview'">
                        <div>
                            <div class="page-header">
                                <h2>Dashboard Overview</h2>
                                <p>Monitor your fleet tracking infrastructure at a glance</p>
                            </div>

                            <div class="stats-grid">
                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div>
                                            <div class="stat-value">24</div>
                                            <div class="stat-label">Active Vehicles</div>
                                        </div>
                                        <div class="stat-icon" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">🚛</div>
                                    </div>
                                    <span class="stat-change positive">↑ 12% from last month</span>
                                </div>

                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div>
                                            <div class="stat-value">1.2M</div>
                                            <div class="stat-label">GPS Points Today</div>
                                        </div>
                                        <div class="stat-icon" style="background: linear-gradient(135deg, #22c55e, #10b981);">📍</div>
                                    </div>
                                    <span class="stat-change positive">↑ 8% from yesterday</span>
                                </div>

                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div>
                                            <div class="stat-value">18ms</div>
                                            <div class="stat-label">Avg Query Time</div>
                                        </div>
                                        <div class="stat-icon" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">⚡</div>
                                    </div>
                                    <span class="stat-change positive">↓ 6ms improvement</span>
                                </div>

                                <div class="stat-card">
                                    <div class="stat-header">
                                        <div>
                                            <div class="stat-value">99.98%</div>
                                            <div class="stat-label">Uptime (30d)</div>
                                        </div>
                                        <div class="stat-icon" style="background: linear-gradient(135deg, #f59e0b, #f97316);">🔄</div>
                                    </div>
                                    <span class="stat-change positive">↑ 0.05% from last month</span>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Quick Start</h3>
                                </div>
                                <p style="color: var(--gray); margin-bottom: 1.5rem;">
                                    Get started with the WebHost.Systems API in minutes. Copy your API key and start tracking!
                                </p>
                                <div style="background: var(--dark); color: white; padding: 1.5rem; border-radius: 12px; font-family: monospace; font-size: 0.875rem; line-height: 1.8; overflow-x: auto;">
                                    <div style="color: #6b7280;">// Install the client</div>
                                    <div style="color: #a5d6a7;">npm install @webhost.systems/client</div>
                                    <br>
                                    <div style="color: #6b7280;">// Initialize and start tracking</div>
                                    <div><span style="color: #c792ea;">import</span> { WebHostClient } <span style="color: #c792ea;">from</span> <span style="color: #a5d6a7;">'@webhost.systems/client'</span>;</div>
                                    <br>
                                    <div><span style="color: #c792ea;">const</span> client = <span style="color: #c792ea;">new</span> <span style="color: #82aaff;">WebHostClient</span>({</div>
                                    <div>&nbsp;&nbsp;<span style="color: #f78c6c;">apiKey</span>: <span style="color: #a5d6a7;">'<span x-text="apiKeys[0]?.key || 'whs_live_...'"></span>'</span></div>
                                    <div>});</div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- API Keys Tab -->
                    <template x-if="currentTab === 'api-keys'">
                        <div>
                            <div class="page-header">
                                <h2>API Keys</h2>
                                <p>Manage your WebHost.Systems API authentication keys</p>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Your API Keys</h3>
                                    <button @click="showCreateKeyModal = true" class="btn btn-primary btn-small">
                                        + Create New Key
                                    </button>
                                </div>

                                <template x-if="apiKeys.length > 0">
                                    <div class="api-keys-list">
                                        <template x-for="key in apiKeys" :key="key.id">
                                            <div class="api-key-item">
                                                <div class="api-key-info">
                                                    <div class="api-key-name" x-text="key.name"></div>
                                                    <div class="api-key-value" x-text="key.key"></div>

    <script>
        function app() {
            return {
                // Auth State
                isAuthenticated: false,
                user: {
                    name: 'Demo User',
                    email: 'demo@gpscoord.com',
                    organization: 'Demo Fleet Co.'
                },

                // UI State
                currentTab: 'overview',
                showCreateKeyModal: false,
                newKeyName: '',

                // Data
                apiKeys: [
                    {
                        id: 1,
                        name: 'Production Key',
                        key: 'whs_live_sk_abc123def456ghi789jkl',
                        created: '2 weeks ago'
                    },
                    {
                        id: 2,
                        name: 'Development Key',
                        key: 'whs_test_sk_xyz789uvw456rst123pqr',
                        created: '1 month ago'
                    }
                ],

                // Methods
                init() {
                    // Check if user is already authenticated (from localStorage)
                    const stored = localStorage.getItem('gpscoord_user');
                    if (stored) {
                        this.user = JSON.parse(stored);
                        this.isAuthenticated = true;
                    }
                },

                loginWithWorkOS(provider) {
                    // In production, this would redirect to WorkOS OAuth flow
                    // For demo, we'll simulate authentication
                    alert(`🚀 In production, this would redirect to WorkOS ${provider} authentication.\n\nFor now, use the demo login button!`);
                    
                    // Uncomment this in production:
                    // window.location.href = `https://api.workos.com/sso/authorize?provider=${provider}&client_id=YOUR_CLIENT_ID&redirect_uri=${encodeURIComponent(window.location.origin + '/callback')}`;
                },

                demoLogin() {
                    this.isAuthenticated = true;
                    localStorage.setItem('gpscoord_user', JSON.stringify(this.user));
                },

                logout() {
                    this.isAuthenticated = false;
                    localStorage.removeItem('gpscoord_user');
                    this.currentTab = 'overview';
                },

                createApiKey() {
                    if (!this.newKeyName.trim()) {
                        alert('Please enter a key name');
                        return;
                    }

                    const newKey = {
                        id: this.apiKeys.length + 1,
                        name: this.newKeyName,
                        key: `whs_live_sk_${this.generateRandomString(24)}`,
                        created: 'Just now'
                    };

                    this.apiKeys.unshift(newKey);
                    this.showCreateKeyModal = false;
                    this.newKeyName = '';

                    // Show success message
                    alert(`✅ API Key "${newKey.name}" created successfully!\n\nKey: ${newKey.key}\n\nMake sure to copy it now - you won't be able to see it again!`);
                },

                deleteApiKey(id) {
                    if (confirm('Are you sure you want to revoke this API key? This action cannot be undone.')) {
                        this.apiKeys = this.apiKeys.filter(key => key.id !== id);
                    }
                },

                copyToClipboard(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        alert('✅ API key copied to clipboard!');
                    }).catch(() => {
                        alert('❌ Failed to copy to clipboard');
                    });
                },

                generateRandomString(length) {
                    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                    let result = '';
                    for (let i = 0; i < length; i++) {
                        result += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    return result;
                }
            }
        }
    </script>
